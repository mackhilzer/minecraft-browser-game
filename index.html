<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Browser Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
        }

        #inventory {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .block-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .block-slot.selected {
            border-color: #ffff00;
            box-shadow: 0 0 10px rgba(255,255,0,0.5);
        }

        #controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: right;
            z-index: 10;
        }

        #controls p {
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            #ui {
                font-size: 14px;
            }

            .block-slot {
                width: 40px;
                height: 40px;
                font-size: 10px;
            }

            #controls {
                font-size: 11px;
            }

            #controls p {
                margin: 3px 0;
            }
        }

        @media (max-width: 480px) {
            #ui {
                font-size: 12px;
                top: 5px;
                left: 5px;
            }

            #inventory {
                bottom: 5px;
                left: 5px;
                gap: 3px;
            }

            .block-slot {
                width: 35px;
                height: 35px;
                font-size: 9px;
            }

            #controls {
                bottom: 5px;
                right: 5px;
                padding: 8px;
                font-size: 10px;
            }

            #controls p {
                margin: 2px 0;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>⛏️ Minecraft Game</div>
        </div>
        <div id="inventory">
            <div class="block-slot selected" data-block="grass">🟩 Grass</div>
            <div class="block-slot" data-block="stone">⬜ Stone</div>
            <div class="block-slot" data-block="wood">🟫 Wood</div>
            <div class="block-slot" data-block="dirt">🟪 Dirt</div>
        </div>
        <div id="controls">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Click/Tap: Place/Break</p>
            <p>⬅️ ➡️ ⬆️ ⬇️: Move</p>
            <p>Mobile: Tap slots to select</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Handle high DPI displays
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);

        const BLOCK_SIZE = 40;
        const GRID_WIDTH = Math.ceil(window.innerWidth / BLOCK_SIZE) + 2;
        const GRID_HEIGHT = Math.ceil(window.innerHeight / BLOCK_SIZE) + 2;

        // Block colors
        const blockColors = {
            grass: '#5fb348',
            stone: '#7f8e8e',
            wood: '#8b4513',
            dirt: '#9c6d3f',
            water: '#1e90ff',
            sand: '#f4a460'
        };

        // Game state
        let grid = [];
        let playerX = Math.floor(GRID_WIDTH / 2);
        let playerY = Math.floor(GRID_HEIGHT / 2);
        let selectedBlock = 'grass';
        let cameraX = 0;
        let cameraY = 0;

        // Input
        const keys = {};
        const touchKeys = {};

        // Initialize grid with random terrain
        function initializeGrid() {
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const noise = Math.random();
                    if (noise < 0.5) grid[y][x] = 'grass';
                    else if (noise < 0.7) grid[y][x] = 'dirt';
                    else if (noise < 0.85) grid[y][x] = 'stone';
                    else grid[y][x] = 'grass';
                }
            }
        }

        // Keyboard events
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Mouse click to place/break blocks
        canvas.addEventListener('click', (e) => {
            placeOrBreakBlock(e);
        });

        // Touch support for placing/breaking blocks
        canvas.addEventListener('touchstart', (e) => {
            if (!isUIElement(e.touches[0])) {
                e.preventDefault();
                placeOrBreakBlock(e.touches[0]);
            }
        });

        function isUIElement(touch) {
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            return x < 200 || y > window.innerHeight - 100;
        }

        function placeOrBreakBlock(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left + cameraX) / BLOCK_SIZE);
            const y = Math.floor((e.clientY - rect.top + cameraY) / BLOCK_SIZE);

            if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                if (e.button === 2 || e.touches) {
                    // Right click or touch break
                    grid[y][x] = null;
                } else {
                    // Left click place
                    grid[y][x] = selectedBlock;
                }
            }
        }

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            placeOrBreakBlock(e);
        });

        // Block selection
        document.querySelectorAll('.block-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                document.querySelectorAll('.block-slot').forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                selectedBlock = slot.dataset.block;
            });

            slot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                document.querySelectorAll('.block-slot').forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                selectedBlock = slot.dataset.block;
            });
        });

        // Update player position
        function update() {
            if (keys['w'] || keys['arrowup']) playerY--;
            if (keys['s'] || keys['arrowdown']) playerY++;
            if (keys['a'] || keys['arrowleft']) playerX--;
            if (keys['d'] || keys['arrowright']) playerX++;

            // Clamp player position
            playerX = Math.max(0, Math.min(GRID_WIDTH - 1, playerX));
            playerY = Math.max(0, Math.min(GRID_HEIGHT - 1, playerY));

            // Update camera to follow player
            cameraX = playerX * BLOCK_SIZE - window.innerWidth / 2 + BLOCK_SIZE / 2;
            cameraY = playerY * BLOCK_SIZE - window.innerHeight / 2 + BLOCK_SIZE / 2;

            cameraX = Math.max(0, Math.min(GRID_WIDTH * BLOCK_SIZE - window.innerWidth, cameraX));
            cameraY = Math.max(0, Math.min(GRID_HEIGHT * BLOCK_SIZE - window.innerHeight, cameraY));
        }

        // Draw game
        function draw() {
            // Draw sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Draw blocks
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const block = grid[y][x];
                    if (block) {
                        const screenX = x * BLOCK_SIZE - cameraX;
                        const screenY = y * BLOCK_SIZE - cameraY;

                        if (screenX + BLOCK_SIZE > 0 && screenX < window.innerWidth &&
                            screenY + BLOCK_SIZE > 0 && screenY < window.innerHeight) {
                            ctx.fillStyle = blockColors[block];
                            ctx.fillRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
                            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(screenX, screenY, BLOCK_SIZE, BLOCK_SIZE);
                        }
                    }
                }
            }

            // Draw player
            const playerScreenX = playerX * BLOCK_SIZE - cameraX + BLOCK_SIZE / 2;
            const playerScreenY = playerY * BLOCK_SIZE - cameraY + BLOCK_SIZE / 2;
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(playerScreenX - 12, playerScreenY - 20, 24, 30);
            ctx.fillStyle = '#fdbcb4';
            ctx.beginPath();
            ctx.arc(playerScreenX, playerScreenY - 25, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        });

        // Start game
        initializeGrid();
        gameLoop();
    </script>
</body>
</html>
